name: Scheduled Triton LLVM bundles
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-triton-llvm-bundles
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tips: ${{ steps.plan.outputs.tips }}
    steps:
      - name: Find unreleased LLVM tips
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, os, re, subprocess

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", "--paginate", "--slurp", path]))

          repo = os.environ["GH_REPO"]
          lines = {"triton_": ("core", "llvm"), "fbtriton-beta-amd-codegen": ("amd", "amd-llvm")}
          platforms = ("almalinux-arm64", "almalinux-x64", "ubuntu-arm64", "ubuntu-x64")
          released = {}
          for page in api(f"repos/{repo}/releases?per_page=100"):
              for release in page:
                  match = re.fullmatch(r"(llvm|amd-llvm)-([0-9a-f]{8})-([0-9]+)", release["tag_name"])
                  if not match:
                      continue
                  prefix, short, number = match.groups()
                  assets = {asset["name"]: asset for asset in release["assets"]}
                  names = [f"{prefix}-{short}-{platform}-{number}.tar.gz" for platform in platforms]
                  if all(name in assets and assets[name].get("digest")
                         and assets.get(name + ".sha256", {}).get("digest") for name in names):
                      released[(prefix, release["target_commitish"])] = release["tag_name"]
          tips = []
          for branch_prefix, (kind, prefix) in lines.items():
              for page in api(f"repos/{repo}/git/matching-refs/heads/{branch_prefix}"):
                  for ref in page:
                      branch = ref["ref"].removeprefix("refs/heads/")
                      commits = json.loads(subprocess.check_output(
                          ["gh", "api", f"repos/{repo}/commits?sha={branch}&per_page=30"]))
                      tip_tree = commits[0]["commit"]["tree"]["sha"]
                      same_tree = [c["sha"] for c in commits if c["commit"]["tree"]["sha"] == tip_tree]
                      done = next((released[(prefix, sha)] for sha in same_tree
                                   if (prefix, sha) in released), None)
                      print(f"{branch}: tip {commits[0]['sha'][:12]} -> {done or 'build ' + kind}")
                      tip = {"ref": commits[0]["sha"], "kind": kind}
                      if done is None and tip not in tips:
                          tips.append(tip)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tips={json.dumps(tips)}\n")

  build:
    needs: plan
    if: needs.plan.outputs.tips != '[]'
    strategy:
      fail-fast: false
      matrix:
        tip: ${{ fromJSON(needs.plan.outputs.tips) }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release-triton-llvm-bundles.yml
    with:
      llvm_ref: ${{ matrix.tip.ref }}
      kind: ${{ matrix.tip.kind }}
