name: Scheduled Triton LLVM bundles
# Builds bundles for every triton_* branch tip, and AMD codegen LLVM SDKs for every
# fbtriton-beta-amd-codegen* branch tip, that has no release yet, by calling
# release-triton-llvm-bundles.yml. ShipIt's empty sync commits do not
# trigger a build: a tip whose tree matches an already-released commit under it
# counts as released. Tips that are already released cost one API call each.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, never cancelled mid-build. GitHub keeps only the newest
# pending run, so hourly checks queued behind a long build collapse into one.
concurrency:
  group: scheduled-triton-llvm-bundles
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tips: ${{ steps.plan.outputs.tips }}
    steps:
      - name: Find unreleased branch tips
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import json, os, re, subprocess

          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", "--paginate", "--slurp", path]))

          repo = os.environ["GH_REPO"]
          # Branch prefix -> (kind, release tag prefix).
          lines = {"triton_": ("core", "llvm"), "fbtriton-beta-amd-codegen": ("amd", "amd-llvm")}
          released = {}
          for page in api(f"repos/{repo}/releases?per_page=100"):
              for release in page:
                  m = re.fullmatch(r"(llvm|amd-llvm)-[0-9a-f]{8}-[0-9]+", release["tag_name"])
                  if m:
                      released[(m.group(1), release["target_commitish"])] = release["tag_name"]
          tips = []
          for branch_prefix, (kind, tag_prefix) in lines.items():
              for page in api(f"repos/{repo}/git/matching-refs/heads/{branch_prefix}"):
                  for ref in page:
                      branch = ref["ref"].removeprefix("refs/heads/")
                      commits = json.loads(subprocess.check_output(
                          ["gh", "api", f"repos/{repo}/commits?sha={branch}&per_page=30"]))
                      tip_tree = commits[0]["commit"]["tree"]["sha"]
                      same_tree = [c["sha"] for c in commits if c["commit"]["tree"]["sha"] == tip_tree]
                      done = next((released[(tag_prefix, sha)] for sha in same_tree
                                   if (tag_prefix, sha) in released), None)
                      print(f"{branch}: tip {commits[0]['sha'][:12]} -> {done or 'build ' + kind}")
                      tip = {"ref": commits[0]["sha"], "kind": kind}
                      if done is None and tip not in tips:
                          tips.append(tip)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tips={json.dumps(tips)}\n")

  build:
    needs: plan
    if: needs.plan.outputs.tips != '[]'
    strategy:
      fail-fast: false
      matrix:
        tip: ${{ fromJSON(needs.plan.outputs.tips) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-triton-llvm-bundles.yml
    with:
      llvm_ref: ${{ matrix.tip.ref }}
      kind: ${{ matrix.tip.kind }}
